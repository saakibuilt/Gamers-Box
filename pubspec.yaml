name: gamersbox
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  firebase_core: ^3.14.0
  firebase_database: ^11.3.7
  firebase_auth: ^5.6.0
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/gif/game1.gif
    - assets/gif/game2.gif
    - assets/gif/launch.gif
    - assets/games/snake.png

flutter_launcher_icons:
  ios: true          # only iOS icons
  android: false
  image_path_ios: assets/images/logo.png
  remove_alpha_ios: true